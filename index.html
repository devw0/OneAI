<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>OneAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #0f0f10;
      --panel: #17181b;
      --panel-soft: #1e2024;
      --text: #e6e6e6;
      --text-muted: #9a9a9a;
      --accent: #ffffff;
      --border: #2a2c31;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 260px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 14px;
    }

    .sidebar h3 {
      margin: 0 0 10px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .chat-history {
      flex: 1;
      background: var(--panel-soft);
      border-radius: var(--radius);
      padding: 10px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .sidebar-footer {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #2b2d33;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 18px;
    }

    .auth-buttons {
      display: flex;
      gap: 8px;
      flex: 1;
    }

    .btn {
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #202226;
      color: var(--text);
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn.primary {
      background: #ffffff;
      color: #000;
      border: none;
    }

    /* ===== MAIN ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .topbar {
      height: 56px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .model-select {
      background: #1c1e22;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }

    .welcome {
      margin-top: 60px;
      text-align: center;
      color: var(--text-muted);
      font-size: 15px;
    }

    /* ===== INPUT ===== */
    .input-wrapper {
      position: absolute;
      bottom: 20px;
      width: calc(100% - 80px);
      max-width: 900px;
      background: #1a1c20;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }

    .plus {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #2a2c31;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--accent);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      font-size: 14px;
      line-height: 1.4;
      min-height: 36px;
      max-height: 120px;
    }

    .model-name {
      color: var(--text-muted);
      font-size: 13px;
      margin-right: 6px;
    }

    .mic {
      font-size: 18px;
      color: var(--text-muted);
      margin-right: 6px;
    }

    .send {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h3>Чаты</h3>
    <div class="chat-history">
      <!-- история потом -->
    </div>

    <div class="sidebar-footer">
      <div class="avatar">👤</div>
      <div class="auth-buttons">
        <button class="btn primary">Зарегистрироваться</button>
        <button class="btn">Войти</button>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="model-select">Выбор модели</div>
    </div>

    <div class="welcome">
      Все нейросети в одном месте
    </div>

    <div class="input-wrapper">
      <div class="plus">+</div>
      <textarea placeholder="Отправить сообщение"></textarea>
      <div class="model-name">GPT-5 mini</div>
      <div class="mic">🎤</div>
      <div class="send">➤</div>
    </div>
  </div>

</body>
</html>
