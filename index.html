<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>OneAI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg:#0f0f10;
  --panel:#17181b;
  --panel2:#1e2024;
  --border:#2a2c31;
  --text:#e6e6e6;
  --muted:#9a9a9a;
}

* { box-sizing:border-box; font-family:system-ui, sans-serif; }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
}

/* sidebar */
.sidebar {
  width:260px;
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:14px;
  display:flex;
  flex-direction:column;
}

.sidebar h3 {
  margin:0 0 10px;
  font-size:14px;
  color:var(--muted);
}

.chat-history {
  flex:1;
  background:var(--panel2);
  border-radius:12px;
  padding:10px;
  color:var(--muted);
  font-size:13px;
}

.sidebar-footer {
  display:flex;
  gap:10px;
  margin-top:12px;
}

.avatar {
  width:36px;
  height:36px;
  border-radius:50%;
  background:#2b2d33;
  display:flex;
  align-items:center;
  justify-content:center;
}

.btn {
  border-radius:999px;
  border:1px solid var(--border);
  background:#202226;
  color:var(--text);
  padding:6px 12px;
  font-size:13px;
}

/* main */
.main {
  flex:1;
  display:flex;
  flex-direction:column;
}

.topbar {
  height:56px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:center;
  align-items:center;
}

.model-select {
  background:#1c1e22;
  border:1px solid var(--border);
  border-radius:999px;
  padding:8px 16px;
  cursor:pointer;
}

.messages {
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.msg {
  max-width:70%;
  margin-bottom:12px;
  padding:10px 12px;
  border-radius:12px;
  line-height:1.4;
}

.msg.user {
  background:#2a2c31;
  margin-left:auto;
}

.msg.ai {
  background:#1f2126;
}

.meta {
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

/* input */
.input {
  padding:14px;
  border-top:1px solid var(--border);
}

.input-box {
  background:#1a1c20;
  border:1px solid var(--border);
  border-radius:16px;
  padding:10px;
  display:flex;
  gap:8px;
  align-items:flex-end;
}

textarea {
  flex:1;
  background:none;
  border:none;
  outline:none;
  color:var(--text);
  resize:none;
  min-height:36px;
}

.model-name {
  font-size:12px;
  color:var(--muted);
}

.send {
  background:#fff;
  color:#000;
  border-radius:50%;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

/* modal */
.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:10;
}

.hidden { display:none; }

.modal-box {
  width:360px;
  background:#181a1f;
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
}

.section {
  margin-top:12px;
}

.section-title {
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
}

.model-item {
  padding:8px 10px;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}

.model-item:hover { background:#22242a; }
.model-item.disabled { color:#666; cursor:not-allowed; }
.badge { font-size:11px; color:#4da3ff; }
</style>
</head>

<body>

<div class="sidebar">
  <h3>Чаты</h3>
  <div class="chat-history">История появится позже</div>
  <div class="sidebar-footer">
    <div class="avatar">👤</div>
    <button class="btn">Войти</button>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div class="model-select">Выбор модели</div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input">
    <div class="input-box">
      <textarea id="input" placeholder="Написать сообщение"></textarea>
      <div class="model-name" id="modelLabel">GPT-5 mini</div>
      <div class="send" id="send">➤</div>
    </div>
  </div>
</div>

<!-- modal -->
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <div class="section">
      <div class="section-title">Текст</div>
      <div class="model-item" data-model="GPT-5 mini">GPT-5 mini <span class="badge">Бесплатно</span></div>
      <div class="model-item disabled">GPT-5 <span>Скоро</span></div>
      <div class="model-item disabled">Claude <span>Скоро</span></div>
    </div>

    <div class="section">
      <div class="section-title">Картинка</div>
      <div class="model-item disabled">Image AI <span>Скоро</span></div>
    </div>

    <div class="section">
      <div class="section-title">Видео</div>
      <div class="model-item disabled">Video AI <span>Скоро</span></div>
    </div>

    <div class="section">
      <div class="section-title">Голос</div>
      <div class="model-item disabled">Voice AI <span>Скоро</span></div>
    </div>
  </div>
</div>

<script>
let currentModel = "GPT-5 mini";

const modal = document.getElementById("modal");
document.querySelector(".model-select").onclick = () => modal.classList.remove("hidden");
modal.onclick = e => { if(e.target === modal) modal.classList.add("hidden"); };

document.querySelectorAll(".model-item[data-model]").forEach(item => {
  item.onclick = () => {
    currentModel = item.dataset.model;
    document.getElementById("modelLabel").textContent = currentModel;
    modal.classList.add("hidden");
  };
});

const messages = document.getElementById("messages");
const input = document.getElementById("input");

document.getElementById("send").onclick = sendMessage;

function sendMessage() {
  if (!input.value.trim()) return;

  addMsg(input.value, "user");
  const prompt = input.value;
  input.value = "";

  setTimeout(() => {
    const reply = fakeAI(prompt);
    addMsg(reply, "ai");
  }, 600);
}

function addMsg(text, role) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;

  if (role === "ai") {
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${text.length} символов · ${currentModel}`;
    div.appendChild(meta);
  }

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function fakeAI(prompt) {
  return `(${currentModel}) Ответ на: "${prompt}". Это заглушка, но логика уже рабочая.`;
}
</script>

</body>
</html>
